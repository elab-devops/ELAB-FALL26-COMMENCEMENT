<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELab Fall 2026 · Commencement Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--bg:#fff;--soft:#8a8a8a;--line:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased}
section{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:18vh 8vw}
a{color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

/* 1. opening */
.open{align-items:center;position:relative;padding:0}
.logo{width:clamp(130px,16vw,180px);height:auto;display:block;animation:fade 800ms ease-out both}
.logo-wrap{position:relative;display:flex;justify-content:center}
.cue{position:absolute;top:calc(100% + 28px);left:50%;transform:translateX(-50%);width:12px;height:22px;animation:fade 800ms ease-out 400ms both}
.cue svg{position:absolute;left:0;width:12px;height:6px;overflow:visible;opacity:0;animation:breathe 2s ease-in-out infinite}
.cue svg:nth-child(1){top:0}
.cue svg:nth-child(2){top:9px;animation-delay:.3s}
.cue path{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(8px)}}

/* 3. invitation */
h1,h2{font-weight:200;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
h1{font-size:clamp(2.6rem,9vw,7.5rem);max-width:14ch}
.lede{font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:200;margin-top:1.5rem}
.details{margin-top:12vh;display:grid;gap:2.2rem;max-width:34rem}
.label{font-size:.75rem;font-weight:400;letter-spacing:.24em;text-transform:uppercase;margin-bottom:.5rem}
.details p{font-size:1.125rem}
.secret{color:var(--soft);margin-top:.25rem}

/* 4. batch */
h2{font-size:clamp(2.2rem,6.5vw,5rem)}
.sub{font-size:1.05rem;color:var(--soft);margin-top:1.2rem}
.grid{list-style:none;display:grid;grid-auto-flow:column;grid-template-rows:auto;grid-auto-columns:calc((100vw - 16vw - .8rem)/2);gap:1.75rem .8rem;margin:9vh -8vw 0;padding:0 8vw;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:8vw;scrollbar-width:none;overscroll-behavior-x:contain}
.grid::-webkit-scrollbar{display:none}
.grid>li{scroll-snap-align:start}
.pager{display:flex;justify-content:center;align-items:center;gap:1.25rem;font-size:.75rem;letter-spacing:.2em;color:var(--soft);margin-top:1.5rem}
.pager button{all:unset;display:none;cursor:pointer;font-size:1rem;letter-spacing:0;padding:.25rem .6rem}
.pager button:disabled{opacity:.25;cursor:default}
.pager button:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.frame{position:relative;aspect-ratio:3/4;background:#efefef;display:block;overflow:hidden}
.frame svg.sil{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(1)}
.frame img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1)}
a.frame{color:inherit;text-decoration:none;cursor:pointer}
.ov em,.under em{display:block;font-style:normal;font-weight:400;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-top:.4rem}
.num{position:absolute;top:.5rem;left:.6rem;font-size:.65rem;font-weight:400;letter-spacing:.2em;color:var(--soft)}
.ov{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:.8rem;opacity:0;transition:opacity 300ms ease}
.frame:hover .ov,.frame:focus-visible .ov,.frame:focus .ov{opacity:1}
.ov b,.under b{display:block;font-weight:300;font-size:.95rem;line-height:1.3}
.ov i,.under i{display:block;font-style:normal;font-weight:200;font-size:.8rem;color:var(--soft)}
.under{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(hover:none){
  .ov{display:none}
  .under{position:static;width:auto;height:auto;clip:auto;overflow:visible;margin-top:.6rem}
}

/* 5. closer */
.batch{min-height:0;padding-bottom:6vh}
.closer{min-height:0;padding:6vh 8vw 24vh;align-items:center;text-align:center}
.closer p{font-size:1.25rem}
.rsvp{margin-top:4rem;font-size:1.25rem}
.rsvp a,.closer a{font-weight:400;text-underline-offset:.35em}

@media(min-width:700px){
  .grid{grid-auto-columns:calc((100vw - 16vw - 4rem)/5);gap:2rem 1rem}
  .pager button{display:inline-block}
  .batch{padding-bottom:6vh}
}
@media(hover:hover){.grid{cursor:grab}.grid.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}}

/* reveal */
.js .reveal{opacity:0;transform:translateY(16px);transition:opacity 600ms ease-out,transform 600ms ease-out;transition-delay:var(--d,0ms)}
.js .reveal.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
  .js .reveal{opacity:1;transform:none}
  .cue svg{opacity:1}
}
</style>
</head>

  ];
  var FADE_FROM=4;           /* index where the fade-out starts (empty frames); null = no fade, no ghosts */
  var GHOSTS=4;              /* faint empty frames after the last real member */
  var FADE=[.8,.5,.28,.12,.04];
  var batch=REAL.concat(Array.from({length:FADE_FROM===null?0:GHOSTS},function(){return null}));
  var grid=document.getElementById('grid');
  batch.forEach(function(p,i){
    var n=('0'+(i+1)).slice(-2),ghost=!p;p=p||['','',''];
    var link=p[2]||'';
    var li=document.createElement('li');li.className='reveal';
    var f=document.createElement(link?'a':'div');f.className='frame';
    var who=[p[0],p[1]].filter(Boolean).join(', ');
    if(link){f.href=link;f.target='_blank';f.rel='noopener noreferrer';f.draggable=false;
      f.setAttribute('aria-label',who+', LinkedIn profile (opens in a new tab)')}
    else if(ghost){f.setAttribute('aria-hidden','true');f.style.pointerEvents='none'}
    else{f.tabIndex=0;f.setAttribute('aria-label',n+', '+who)}
    var more=link?'<em>LinkedIn \u2197</em>':'';
    f.innerHTML=(PHOTOS[i]?'<img class="ph" src="'+PHOTOS[i]+'" alt="" draggable="false">':'<svg class="sil" viewBox="0 0 30 40" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><use href="#sil"/></svg>')+
      '<span class="num">'+n+'</span>'+(ghost?'':'<span class="ov" aria-hidden="true"><b></b><i></i>'+more+'</span>');
    var op=(FADE_FROM!==null&&i>=FADE_FROM)?(FADE[i-FADE_FROM]!==undefined?FADE[i-FADE_FROM]:0):1;
    f.style.opacity=op;
    li.appendChild(f);
    if(!ghost){
      var u=document.createElement('div');u.className='under';u.innerHTML='<b></b><i></i>'+more;u.style.opacity=op;
      [f,u].forEach(function(box){
        box.querySelectorAll('b').forEach(function(el){el.textContent=p[0]});
        box.querySelectorAll('i').forEach(function(el){el.textContent=p[1]});
      });
      li.appendChild(u);
    }
    grid.appendChild(li);
  });

  /* RSVP: opens a prefilled reply email (no backend, the reply carries their address) */
  var RSVP_EMAIL='rsvp@example.com'; /* TODO: your address */
  var rsvpBody='Hi, I\u2019ll be there.\n\n'+(name?'\u2014 '+name:'Name:\n');
  var rsvpHref='mailto:'+RSVP_EMAIL+'?subject='+encodeURIComponent('RSVP: E-Lab Fall 2026'+(name?' \u2013 '+name:''))+'&body='+encodeURIComponent(rsvpBody);
  document.querySelectorAll('.rsvp-link').forEach(function(a){a.href=rsvpHref});

  /* page counter */
  var pcount=document.getElementById('pcount'),prev=document.getElementById('prev'),next=document.getElementById('next');
  var pad=function(n){return('0'+n).slice(-2)},mq=matchMedia('(min-width:700px)'),rm=matchMedia('(prefers-reduced-motion: reduce)');
  var per=function(){return mq.matches?5:2},beh=function(){return rm.matches?'auto':'smooth'};
  function step(){var li=grid.children;return li[1]?li[1].offsetLeft-li[0].offsetLeft:grid.clientWidth}
  function pageW(){return step()*per()}
  function upd(){
    var total=grid.children.length,st=step()||1,end=grid.scrollLeft+grid.clientWidth>=grid.scrollWidth-2,start=grid.scrollLeft<=2;
    var first=end?total-per()+1:Math.min(Math.max(Math.round(grid.scrollLeft/st)+1,1),total);
    var last=end?total:Math.min(first+per()-1,total);
    pcount.textContent=pad(first)+'\u2013'+pad(last)+' / '+pad(total);prev.disabled=start;next.disabled=end;
  }
  prev.addEventListener('click',function(){grid.scrollBy({left:-pageW(),behavior:beh()})});
  next.addEventListener('click',function(){grid.scrollBy({left:pageW(),behavior:beh()})});
  grid.addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();
  if(FADE_FROM!==null)document.getElementById('pager').style.display='none'; /* a count would give the teaser away */

  /* RSVP in the invitation frame: scroll to the bottom of the page (the closing RSVP opens the email) */
  document.querySelectorAll('.rsvp-down').forEach(function(a){
    a.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:document.documentElement.scrollHeight,behavior:beh()})});
  });

  /* mouse drag-to-swipe (touch and trackpad swipe natively) */
  var down=false,moved=false,supp=false,sx=0,sl=0;
  grid.addEventListener('click',function(e){if(supp){e.preventDefault();e.stopPropagation()}},true);
  grid.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=grid.scrollLeft});
  addEventListener('pointermove',function(e){
    if(!down)return;var dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)>4){moved=true;grid.classList.add('drag')}
    if(moved)grid.scrollLeft=sl-dx;
  });
  addEventListener('pointerup',function(){
    if(!down)return;down=false;if(!moved)return;
    var w=step()||1;grid.classList.remove('drag');supp=true;setTimeout(function(){supp=false},60);
    grid.scrollTo({left:Math.round(grid.scrollLeft/w)*w,behavior:beh()});
  });
  /* stagger: 80ms between siblings (capped), then observe */
  var groups=new Map();
  document.querySelectorAll('.reveal').forEach(function(el){
    var k=el.parentNode,i=groups.get(k)||0;
    el.style.setProperty('--d',Math.min(i,5)*80+'ms');
    groups.set(k,i+1);
  });
  var items=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){
    items.forEach(function(el){el.classList.add('in')});return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});
  },{threshold:.15});
  items.forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
